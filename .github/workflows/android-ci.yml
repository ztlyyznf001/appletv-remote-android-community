name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Tests, lint and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          # Use only the built-in open-source GitHub cache, not enhanced commercial caching.
          cache-provider: basic
          # PRs (including same-repository PRs) cannot write the default branch cache.
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          dependency-graph: disabled
      - name: Validate workflow and pipeline scripts
        run: |
          scripts/ci/lint-workflows.sh
          python3 -m unittest discover -s scripts/ci/tests -v
      - name: Build and verify
        run: python3 scripts/ci/pipeline.py verify
      - name: Upload test and lint reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
            protocol/build/reports/
            protocol/build/test-results/
          if-no-files-found: warn
          retention-days: 7
          archive: true
      - name: Upload debug APK (ephemeral test signing)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          archive: true
